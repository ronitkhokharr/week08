name: 00 - Terraform Infrastructure

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - task-10.2d-devsecops
    paths:
      - "terraform/**"
      - ".github/workflows/00-terraform.yml"

jobs:
  terraform:
    name: Terraform Infrastructure
    runs-on: ubuntu-latest

    env:
      TF_VAR_resource_group_name: "koalatech-week08-rg"
      TF_VAR_acr_name: "sit722s225160851acr08"
      TF_VAR_storage_account_name: "sit722s225160851st08"
      TF_VAR_aks_cluster_name: "sit722-week08-aks"
      TF_VAR_aks_dns_prefix: "sit722week08"
      TF_VAR_aks_node_count: "2"
      TF_VAR_aks_node_vm_size: "Standard_B2s_v2"
      TF_VAR_environment: "week08"

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure Terraform Azure Authentication
        shell: bash
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          echo "ARM_CLIENT_ID=$(echo "$AZURE_CREDENTIALS" | jq -r '.clientId')" >> "$GITHUB_ENV"
          echo "ARM_CLIENT_SECRET=$(echo "$AZURE_CREDENTIALS" | jq -r '.clientSecret')" >> "$GITHUB_ENV"
          echo "ARM_SUBSCRIPTION_ID=$(echo "$AZURE_CREDENTIALS" | jq -r '.subscriptionId')" >> "$GITHUB_ENV"
          echo "ARM_TENANT_ID=$(echo "$AZURE_CREDENTIALS" | jq -r '.tenantId')" >> "$GITHUB_ENV"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan

      - name: Verify Azure Resources
        run: |
          az group show --name "$TF_VAR_resource_group_name" --output table
          az aks show \
            --resource-group "$TF_VAR_resource_group_name" \
            --name "$TF_VAR_aks_cluster_name" \
            --output table
          az acr show \
            --resource-group "$TF_VAR_resource_group_name" \
            --name "$TF_VAR_acr_name" \
            --output table